# Structural lint, EUnit and dialyzer, on every pull request and push to main.
#
# THE SUITE RUNS A STAND-IN SERVICE THROUGH mcl_om'S REAL FACADE over the
# in-memory mesh, so a green run means the harness still stubs the identity
# every mcl-* service resolves its pool and realm through. When mcl_om moves
# that seam, this goes red here rather than in every service's suite.
#
# THE TOOLCHAIN IS THE IMAGE, pinned by its dated tag AND digest, the same one
# every macula-services gate runs in (OTP 28.4.3). The toolchain step refuses
# any other release. rebar.lock is gitignored, so deps resolve fresh.

name: lint-and-test

on:
  pull_request:
    paths-ignore: ['**.md', 'LICENSE']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

concurrency:
  group: lint-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint + eunit + dialyzer (OTP 28.4.3)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: ghcr.io/macula-io/macula-ci-otp:20260923-1347@sha256:b2260d084a3d3c5e0b74932c4ee052a0cadfddddb6587d5d2214873e6bb06330
    steps:
      - uses: actions/checkout@v4

      - name: Verify the toolchain is the one we think it is
        run: |
          rebar3 version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            io:format("OTP ~s~n", [Otp]),
            case Otp of
                <<"28.4.3">> -> halt(0);
                _            -> halt(1)
            end.'

      - name: Cache the hex package cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rebar3/hex
          key: rebar3-hex-${{ hashFiles('rebar.config') }}
          restore-keys: rebar3-hex-

      - run: rebar3 lint
      - run: rebar3 eunit
      - run: rebar3 dialyzer
